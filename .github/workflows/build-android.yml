name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Capacitor only
        run: npm install @capacitor/core @capacitor/cli @capacitor/android --no-save

      - name: Create placeholder web assets
        run: |
          mkdir -p dist
          echo "<!DOCTYPE html><html><head><title>CoinQuest</title></head><body>Loading...</body></html>" > dist/index.html

      - name: Add Android platform (first run only)
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Fix Kotlin stdlib version conflict
        run: |
          cat >> android/build.gradle << 'EOF'

          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                  }
              }
          }
          EOF
      - name: Add Appodeal Gradle repository
        run: |
          sed -i '/allprojects {/,/}/ s|repositories {|repositories {\n        maven { url "https://artifactory.appodeal.com/appodeal" }|' android/build.gradle

      - name: Add Appodeal SDK dependencies
        run: |
          cat >> android/app/build.gradle << 'EOF'

          dependencies {
              implementation "com.appodeal.ads.sdk:core:4.3.0"
              implementation "com.appodeal.ads.sdk.adapters:admob:25.2.0.0"
              implementation "com.appodeal.ads.sdk.adapters:iab:1.8.1.0"
          }
          EOF

      - name: Create network security config
        run: |
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/network_security_config.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true">
                  <trust-anchors>
                      <certificates src="system" />
                  </trust-anchors>
              </base-config>
          </network-security-config>
          EOF

      - name: Patch AndroidManifest for Appodeal
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<application\n        android:networkSecurityConfig="@xml/network_security_config"|' $MANIFEST
          sed -i 's|</application>|    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-2311902368895930~2235787223"/>\n    </application>|' $MANIFEST
      - name: Add Appodeal MainActivity and plugin
        run: |
          PKG_DIR=android/app/src/main/java/com/rahulrajput/coinquest
          mkdir -p $PKG_DIR

          cat > $PKG_DIR/MainActivity.java << 'EOF'
          package com.rahulrajput.coinquest;

          import android.os.Bundle;
          import com.appodeal.ads.Appodeal;
          import com.appodeal.ads.initializing.ApdInitializationCallback;
          import com.appodeal.ads.initializing.ApdInitializationError;
          import com.getcapacitor.BridgeActivity;
          import java.util.List;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(AppodealPlugin.class);
                  super.onCreate(savedInstanceState);

                  Appodeal.initialize(
                      this,
                      "3eeaf954f7b9a037e85fdf6fa7e1073417864658f2a64e01",
                      Appodeal.REWARDED_VIDEO,
                      new ApdInitializationCallback() {
                          @Override
                          public void onInitializationFinished(List<ApdInitializationError> errors) {
                          }
                      }
                  );
              }
          }
          EOF

          cat > $PKG_DIR/AppodealPlugin.java << 'EOF'
          package com.rahulrajput.coinquest;

          import com.appodeal.ads.Appodeal;
          import com.appodeal.ads.RewardedVideoCallbacks;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "Appodeal")
          public class AppodealPlugin extends Plugin {

              private PluginCall pendingShowCall;

              @Override
              public void load() {
                  super.load();
                  Appodeal.setRewardedVideoCallbacks(new RewardedVideoCallbacks() {
                      @Override
                      public void onRewardedVideoLoaded(boolean isPrecache) {}

                      @Override
                      public void onRewardedVideoFailedToLoad() {}

                      @Override
                      public void onRewardedVideoShown() {}

                      @Override
                      public void onRewardedVideoShowFailed() {
                          resolvePending(false, 0, "");
                      }

                      @Override
                      public void onRewardedVideoClicked() {}

                      @Override
                      public void onRewardedVideoClosed(boolean finished) {
                          if (!finished) {
                              resolvePending(false, 0, "");
                          }
                      }

                      @Override
                      public void onRewardedVideoExpired() {
                          resolvePending(false, 0, "");
                      }

                      @Override
                      public void onRewardedVideoFinished(double amount, String currency) {
                          resolvePending(true, amount, currency);
                      }
                  });
              }

              private void resolvePending(boolean rewarded, double amount, String currency) {
                  if (pendingShowCall == null) return;
                  JSObject result = new JSObject();
                  result.put("rewarded", rewarded);
                  result.put("amount", amount);
                  result.put("currency", currency);
                  pendingShowCall.resolve(result);
                  pendingShowCall = null;
              }

              @PluginMethod
              public void isRewardedVideoLoaded(PluginCall call) {
                  JSObject result = new JSObject();
                  result.put("loaded", Appodeal.isLoaded(Appodeal.REWARDED_VIDEO));
                  call.resolve(result);
              }

              @PluginMethod
              public void showRewardedVideo(PluginCall call) {
                  if (!Appodeal.isLoaded(Appodeal.REWARDED_VIDEO)) {
                      JSObject result = new JSObject();
                      result.put("rewarded", false);
                      call.resolve(result);
                      return;
                  }
                  pendingShowCall = call;
                  getActivity().runOnUiThread(() -> Appodeal.show(getActivity(), Appodeal.REWARDED_VIDEO));
              }
          }
          EOF

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build debug APK
        working-directory: android
        run: chmod +x ./gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: coinquest-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
